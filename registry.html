<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صارف پروفائل رجسٹری</title>
    <!-- Tailwind CSS for Beautiful Modern UI -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .direction-rtl { direction: rtl; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-12">

    <!-- Premium Header Area -->
    <div class="bg-slate-900 text-white py-8 px-4 text-center shadow-lg border-b border-slate-800">
        <h1 class="text-2xl font-bold tracking-wide">صارف پروفائل رجسٹری</h1>
        <p class="text-slate-400 text-xs mt-2 font-mono">User Profile Registry System</p>
    </div>

    <!-- Main Container Card -->
    <div class="max-w-md mx-auto mt-6 px-4">
        
        <!-- Success Banner Popup (Hidden by default) -->
        <div id="successBanner" class="hidden bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-2xl p-6 text-center shadow-sm mb-6 animate-fade-in">
            <div class="w-12 h-12 bg-emerald-500 rounded-full flex items-center justify-center mx-auto mb-3 shadow-sm">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h3 class="text-lg font-bold">معلومات کامیابی کے ساتھ محفوظ ہو گئیں!</h3>
            <p class="text-sm text-emerald-600 mt-1">Data registry processed successfully!</p>
        </div>

        <!-- Form Card Start -->
        <div id="formCard" class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6">
            <form id="registryForm" onsubmit="handleFormSubmit(event)" class="space-y-6">
                
                <!-- ================= PHASE 1 ================= -->
                <div class="border-b border-slate-100 pb-3 mb-4">
                    <span class="bg-blue-50 text-blue-600 text-xs font-bold px-2.5 py-1 rounded-full">Phase 1</span>
                    <h2 class="text-base font-bold text-slate-800 mt-2 text-right">خاندانی اور بنیادی معلومات</h2>
                </div>

                <!-- 1. Full Name Alias -->
                <div class="flex flex-col space-y-1.5">
                    <label class="text-sm font-semibold text-slate-700 text-right">صارف کا نام (Full Name)</label>
                    <input type="text" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-900 text-right bg-slate-50/50" placeholder="نام لکھیں">
                </div>

                <!-- 2. Relationship Selector -->
                <div class="flex flex-col space-y-1.5">
                    <label class="text-sm font-semibold text-slate-700 text-right">رشتہ منتخب کریں</label>
                    <select required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-900 text-right bg-slate-50/50 direction-rtl">
                        <option value="father">والد (Father)</option>
                        <option value="husband">شوہر (Husband)</option>
                    </select>
                </div>

                <!-- 3. Guardian / Relative Name -->
                <div class="flex flex-col space-y-1.5">
                    <label class="text-sm font-semibold text-slate-700 text-right">سرپرست کا نام (Guardian Name)</label>
                    <input type="text" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-900 text-right bg-slate-50/50" placeholder="والد یا شوہر کا نام لکھیں">
                </div>

                <!-- 4. Mobile Contact Token -->
                <div class="flex flex-col space-y-1.5">
                    <label class="text-sm font-semibold text-slate-700 text-right">موبائل نمبر (Mobile Number)</label>
                    <input type="tel" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-900 text-left bg-slate-50/50" placeholder="03XXXXXXXXX">
                </div>

                <!-- NEW FIELD: 5. Identity Card Number (CNIC) -->
                <div class="flex flex-col space-y-1.5">
                    <label class="text-sm font-semibold text-slate-700 text-right">شناختی کارڈ نمبر (ID Card Number)</label>
                    <input type="text" required pattern="[0-9]{5}-[0-9]{7}-[0-9]{1}" title="Format: 36102-1234567-1" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-900 text-left bg-slate-50/50 font-mono" placeholder="XXXXX-XXXXXXX-X">
                </div>

                <!-- 6. Marital Status Dropdown -->
                <div class="flex flex-col space-y-1.5">
                    <label class="text-sm font-semibold text-slate-700 text-right">ازدواجی حیثیت (Marital Status)</label>
                    <select id="maritalStatus" required onchange="toggleKidsFields()" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-900 text-right bg-slate-50/50 direction-rtl">
                        <option value="single">غیر شادی شدہ (Single)</option>
                        <option value="married">شادی شدہ (Married)</option>
                    </select>
                </div>

                <!-- Dynamic Kids Matrix Fields (Hidden by Default) -->
                <div id="kidsSection" class="hidden space-y-4 pt-3 mt-3 border-t border-dashed border-slate-200">
                    <!-- Total Number of Kids -->
                    <div class="flex flex-col space-y-1.5">
                        <label class="text-sm font-semibold text-slate-700 text-right">کل بچوں کی تعداد (Total Kids)</label>
                        <input type="number" id="totalKids" min="0" value="0" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-900 text-center bg-slate-50/50">
                    </div>
                    <!-- Grid for Male and Female counters -->
                    <div class="grid grid-cols-2 gap-4">
                        <div class="flex flex-col space-y-1.5">
                            <label class="text-sm font-semibold text-slate-700 text-center">بیٹیاں (Female)</label>
                            <input type="number" id="femaleKids" min="0" value="0" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-900 text-center bg-slate-50/50">
                        </div>
                        <div class="flex flex-col space-y-1.5">
                            <label class="text-sm font-semibold text-slate-700 text-center">بیٹے (Male)</label>
                            <input type="number" id="maleKids" min="0" value="0" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-900 text-center bg-slate-50/50">
                        </div>
                    </div>
                </div>

                <!-- ================= PHASE 2 ================= -->
                <div class="border-b border-slate-100 pb-3 pt-4 mb-4">
                    <span class="bg-blue-50 text-blue-600 text-xs font-bold px-2.5 py-1 rounded-full">Phase 2</span>
                    <h2 class="text-base font-bold text-slate-800 mt-2 text-right">مکمل رہائشی پتہ (Address Matrix)</h2>
                </div>

                <!-- 1. District -->
                <div class="flex flex-col space-y-1.5">
                    <label class="text-sm font-semibold text-slate-700 text-right">ضلع (District)</label>
                    <input type="text" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-900 text-right bg-slate-50/50" placeholder="ضلع کا نام لکھیں">
                </div>

                <!-- 2. Tehsil -->
                <div class="flex flex-col space-y-1.5">
                    <label class="text-sm font-semibold text-slate-700 text-right">تحصیل (Tehsil)</label>
                    <input type="text" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-900 text-right bg-slate-50/50" placeholder="تحصیل کا نام لکھیں">
                </div>

                <!-- 3. City / Town -->
                <div class="flex flex-col space-y-1.5">
                    <label class="text-sm font-semibold text-slate-700 text-right">شہر یا قصبہ (City / Town)</label>
                    <input type="text" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-900 text-right bg-slate-50/50" placeholder="شہر کا نام لکھیں">
                </div>

                <!-- 4. Residential Address -->
                <div class="flex flex-col space-y-1.5">
                    <label class="text-sm font-semibold text-slate-700 text-right">گھر کا پتہ (Residential Address)</label>
                    <textarea required rows="3" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-900 text-right bg-slate-50/50 resize-none" placeholder="مکمل پتہ، گلی یا محلہ نمبر لکھیں"></textarea>
                </div>

                <!-- ================= PHASE 3 ================= -->
                <div class="border-b border-slate-100 pb-3 pt-4 mb-4">
                    <span class="bg-blue-50 text-blue-600 text-xs font-bold px-2.5 py-1 rounded-full">Phase 3</span>
                    <h2 class="text-base font-bold text-slate-800 mt-2 text-right">سسٹم معلومات (System Metadata)</h2>
                </div>

                <!-- 1. Manual Profile Reference ID -->
                <div class="flex flex-col space-y-1.5">
                    <label class="text-sm font-semibold text-slate-700 text-right">سسٹم ریفرنس نمبر (Manual Profile ID)</label>
                    <input type="text" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-900 text-left bg-slate-50/50 font-mono" placeholder="e.g. REG-12345">
                </div>

                <!-- Control Button -->
                <div class="pt-4">
                    <button type="submit" class="w-full bg-slate-900 text-white font-bold py-4 px-4 rounded-xl shadow-md hover:bg-slate-800 transition duration-150 active:scale-[0.99]">
                        معلومات جمع کریں (Submit Data)
                    </button>
                </div>

            </form>
        </div>
        <!-- Form Card End -->

    </div>

    <!-- JavaScript Loops & Controllers -->
    <script>
        function toggleKidsFields() {
            var status = document.getElementById("maritalStatus").value;
            var kidsSection = document.getElementById("kidsSection");
            
            if (status === "married") {
                kidsSection.classList.remove("hidden");
            } else {
                kidsSection.classList.add("hidden");
                document.getElementById("totalKids").value = 0;
                document.getElementById("maleKids").value = 0;
                document.getElementById("femaleKids").value = 0;
            }
        }

        function handleFormSubmit(event) {
            event.preventDefault(); // Stop standard reload
            
            // Hide the Form card smoothly
            document.getElementById("formCard").classList.add("hidden");
            
            // Show Success Banner UI popup
            var successBanner = document.getElementById("successBanner");
            successBanner.classList.remove("hidden");
            
            // Scroll to top to show banner clearly
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>

</body>
</html>
